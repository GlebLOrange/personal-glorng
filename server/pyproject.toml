[project]
name = "glorng-server"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "uvicorn[standard]==0.52.*",
    "fastapi[standard]==0.141.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.31.*",
    "alembic==1.19.*",
    "pydantic-settings==2.15.*",
    "PyJWT[crypto]==2.13.*",
    "bcrypt==5.0.*",
    "redis[hiredis]==8.1.*",
    "celery==5.6.*",
    "kombu==5.6.*",
    "sentry-sdk[fastapi]==2.68.*",
    "httpx==0.28.*",
    "loguru==0.7.*",
    "python-multipart==0.0.*",
    "aiogram==3.31.*",
    "dateparser==1.4.*",
    "google-auth==2.57.*",
    "google-auth-oauthlib==1.4.*",
    "google-api-python-client==2.199.*",
    "yt-dlp>=2026.8.19",
    "elasticsearch[async]==9.4.*",
    "motor==3.7.*",
    "weasyprint==69.*",
    "firebase-admin>=7.5.0",
    "defusedxml==0.7.*",
    "elastic-opentelemetry==1.15.*",
    "opentelemetry-instrumentation-fastapi==0.64b0",
    "opentelemetry-instrumentation-asgi==0.64b0",
    "opentelemetry-instrumentation-starlette==0.64b0",
    "opentelemetry-instrumentation-httpx==0.64b0",
    "opentelemetry-instrumentation-redis==0.64b0",
    "opentelemetry-instrumentation-celery==0.64b0",
    "opentelemetry-instrumentation-pymongo==0.64b0",
    "opentelemetry-instrumentation-asyncpg==0.64b0",
    "opentelemetry-instrumentation-elasticsearch==0.64b0",
    "opentelemetry-instrumentation-sqlalchemy==0.64b0",
    "opentelemetry-instrumentation-logging==0.64b0",
]

[dependency-groups]
dev = [
    "ruff==0.16.*",
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "aiosqlite==0.22.*",
    "mongomock-motor==0.0.*",
    "mypy>=2.3.1",
    "pytest-cov==7.1.*",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "app/db/migrations",
    "app/db/seed",
    "app/todobot",
]

[[tool.mypy.overrides]]
module = [
    "app.settings",
    "app.routers.platform",
    "app.workers.celery_app",
    "app.services.calendar",
    "app.services.ai_chat",
    "app.db.mongo.client",
    "app.core.redis",
    "app.services.world_time",
    "app.services.auth",
    "app.services.weather",
    "app.services.search_index",
    "app.workers.tasks",
    "app.workers.queue",
    "app.services.github_portfolio",
    "app.services.task_intake",
    "app.schemas.date_filters",
    "app.core.deps",
    "app.routers.auth",
]
ignore_errors = true




[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
  "ANN", "C4", "PT", "T20", "S", "ARG",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN001", "ANN201", "ANN202", "ANN401", "S101", "S105", "S106", "S107",
  "ARG001", "ARG002", "E501", "N806", "SIM101",
]
"app/db/migrations/**/*.py" = ["E402", "E501", "ANN"]
"app/routers/**/*.py" = ["B008"]
"app/core/password_policy.py" = ["S105"]
"app/db/seed/**/*.py" = ["E501"]
"app/services/amp_page.py" = ["E501"]
"app/settings.py" = ["ANN401"]
"app/db/init_service.py" = ["S607"]
"app/db/documents/base.py" = ["ANN401"]
"app/db/repositories/**/*.py" = ["ANN401", "E501", "UP047"]
"app/db/seed_multicooker_recipes.py" = ["E501"]
"app/services/**/*.py" = ["ANN202", "E501"]
"app/todobot/main.py" = ["ANN001"]
"scripts/**/*.py" = ["ANN401", "ANN001"]
"app/services/github.py" = ["S105"]
"app/workers/**/*.py" = ["ARG001", "RUF012"]
"app/todobot/middlewares/**/*.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
override-dependencies = ["aiohttp>=3.14.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: integration tests requiring POSTGRES_TEST_URL",
    "redis: integration tests requiring a real Redis instance at REDIS_URL",
    "integration: slow multi-service tests excluded from the P0 PR gate",
    "e2e_api: full HTTP pipeline tests including middleware",
]

[tool.coverage.run]
source = ["app"]
branch = false
omit = [
    "app/todobot/*",
    "app/db/migrations/*",
    "app/db/seed/*",
    "app/db/seed_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
