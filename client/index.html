    <title>Gleb.Y — Developer Portfolio</title>
    <script>
      /* FOUC: apply data-theme (+ space atmosphere on /) before CSS paint.
         Theme key must match COLOR_THEME_STORAGE_KEY.
         light|dark as stored; legacy `system` → OS once; unset/invalid → dark.
         Atmosphere theme-color hexes must match THEME_COLOR_SPACE_* / base. */
      (function () {
        try {
          var key = "glorng-color-theme";
          var pref = localStorage.getItem(key);
          var theme = "dark";
          if (pref === "light" || pref === "dark") {
            theme = pref;
          } else if (pref === "system") {
            theme =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
            try {
              localStorage.setItem(key, theme);
            } catch (e) {
              /* ignore */
            }
          }
          document.documentElement.setAttribute("data-theme", theme);
          var path = window.location.pathname || "/";
          var space = path === "/" || path === "";
          if (space) {
            document.documentElement.setAttribute("data-atmosphere", "space");
          } else {
            document.documentElement.removeAttribute("data-atmosphere");
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var color;
            if (space) {
              color = theme === "light" ? "#e8eef5" : "#070b14";
            } else {
              color = theme === "light" ? "#e5e7eb" : "#0d1117";
            }
            meta.setAttribute("content", color);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
