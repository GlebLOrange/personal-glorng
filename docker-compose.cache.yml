# Local BuildKit layer cache overlay (pair with DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1).
# Cache dirs live under .docker-cache/ (gitignored). CI uses docker-compose.ci.yml (GHA cache).
#
# Only one service may cache_to a given dest at a time. migrate/server (and other
# images that share the server Dockerfile) build in parallel on `make rebuild`;
# concurrent writers race on rename under .docker-cache/server/ingest/.
services:
  migrate:
    build:
      cache_from:
        - type=local,src=.docker-cache/server
  server:
    build:
      cache_from:
        - type=local,src=.docker-cache/server
      cache_to:
        - type=local,dest=.docker-cache/server,mode=max
  worker:
    build:
      cache_from:
        - type=local,src=.docker-cache/server
  beat:
    build:
      cache_from:
        - type=local,src=.docker-cache/server
  todobot:
    build:
      cache_from:
        - type=local,src=.docker-cache/server
  client:
    build:
      cache_from:
        - type=local,src=.docker-cache/client
      cache_to:
        - type=local,dest=.docker-cache/client,mode=max
