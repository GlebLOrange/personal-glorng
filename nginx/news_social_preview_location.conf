# Social/link-preview bots on /news/{slug} receive static OG HTML from the API.
location ~ ^/news/(?<newsslug>[a-z0-9][a-z0-9-]{0,119})$ {
    set $news_og_slug $newsslug;
    error_page 418 = @news_og_proxy;
    if ($use_news_og_preview) {
        return 418;
    }
    try_files $uri $uri/ /index.html;
}

location @news_og_proxy {
    proxy_pass http://$upstream_server:8000/og/news/$news_og_slug;
    include /etc/nginx/proxy_params.conf;
}
