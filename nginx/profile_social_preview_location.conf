# Social/link-preview bots on /profile receive static OG HTML from the API.
# Reuses $use_news_og_preview from social_preview_map.conf.
location = /profile {
    error_page 418 = @profile_og_proxy;
    if ($use_news_og_preview) {
        return 418;
    }
    try_files $uri $uri/ /index.html;
}

location @profile_og_proxy {
    # Forward original query string (skills/projects/sections).
    proxy_pass http://$upstream_server:8000/og/profile$is_args$args;
    include /etc/nginx/proxy_params.conf;
}
