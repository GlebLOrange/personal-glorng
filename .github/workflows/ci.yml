name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write
  pull-requests: read

# P0 PR gate — backend + frontend.
# Postgres, API Playwright, and docs freshness: ci-extended.yml (workflow_dispatch).
# ci-ok fails when `changes` fails, a selected job fails, or a PR path is outside
# the gate filters and the skip allowlist (the `outside` filter below).
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      outside: ${{ steps.select.outputs.outside }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # ponytail: outside negations duplicate the gate + skip lists.
          # Upgrade path: generate the three filters from one path manifest.
          filters: |
            backend:
              - 'server/**'
              - 'shared/**'
              - 'rabbitmq/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'nginx/**'
              - 'Makefile'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - '.env.example'
              - '.env.production.example'
              - '.dockerignore'
              - '.pre-commit-config.yaml'
            frontend:
              - 'client/**'
              - 'shared/**'
              - 'nginx/**'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            outside:
              - '**'
              - '*'
              - '.*'
              - '**/.*'
              - '**/.*/**'
              - '!server/**'
              - '!shared/**'
              - '!rabbitmq/**'
              - '!deploy/**'
              - '!scripts/**'
              - '!nginx/**'
              - '!Makefile'
              - '!docker-compose*.yml'
              - '!.github/workflows/**'
              - '!.env.example'
              - '!.env.production.example'
              - '!.dockerignore'
              - '!.pre-commit-config.yaml'
              - '!client/**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.mdc'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/FUNDING.yml'
              - '!.github/copilot-instructions.md'
              - '!.github/social-preview.png'
              - '!.github/dependabot.yml'
              - '!.cursor/**'
              - '!.agents/**'
              - '!.devcontainer/**'
              - '!.vscode/**'
              - '!postman/**'
              - '!.editorconfig'
              - '!.nvmrc'
              - '!.gitignore'
              - '!.ignore'
              - '!.rgignore'
              - '!.cursorignore'
              - '!.gitleaks.toml'
              - '!LICENSE'
      - name: Select jobs
        id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "outside=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          echo "outside=${{ steps.filter.outputs.outside }}" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff checks
        run: |
          uv run ruff check . & ruff_check_pid=$!
          uv run ruff format --check . & ruff_format_pid=$!
          wait "$ruff_check_pid"; ruff_check_exit=$?
          wait "$ruff_format_pid"; ruff_format_exit=$?
          exit $((ruff_check_exit || ruff_format_exit))
      - name: Mypy
        run: uv run mypy app
      - name: Pytest (P0 — exclude integration tier)
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.test
        run: uv run pytest -m "not integration" -v --cov=app --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Production vite build rejects localhost/missing origin (OG tags in index.html).
      VITE_PUBLIC_ORIGIN: https://ci.example.test
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint and format check
        run: |
          npm run lint & lint_pid=$!
          npm run format:check & format_pid=$!
          wait "$lint_pid"; lint_exit=$?
          wait "$format_pid"; format_exit=$?
          exit $((lint_exit || format_exit))
      - run: npm run test:coverage
      - run: npm run build:check
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Built-shell smoke (vite preview, no API)
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/built-shell.spec.ts

  ci-ok:
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          OUTSIDE: ${{ needs.changes.outputs.outside }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES"
            exit 1
          fi
          fail=0
          check() {
            local name="$1" selected="$2" result="$3"
            if [ "$selected" != "true" ]; then
              echo "$name: skipped"
              return
            fi
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          }
          check backend "$BACKEND" "$BACKEND_RESULT"
          check frontend "$FRONTEND" "$FRONTEND_RESULT"
          if [ "$OUTSIDE" != "false" ]; then
            echo "outside: changed paths are outside the PR gate and the skip allowlist ($OUTSIDE)"
            fail=1
          else
            echo "outside: false"
          fi
          exit "$fail"
