name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write
  pull-requests: read

# P0 PR gate — backend + frontend.
# Postgres, API Playwright, and docs freshness: ci-extended.yml (workflow_dispatch).
# ci-ok fails when `changes` fails, a selected job fails, or a PR path is outside
# the gate filters and the skip allowlist (the `outside` filter below).
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      outside: ${{ steps.outside.outputs.outside || steps.select.outputs.outside }}
    steps:
      - uses: actions/checkout@v7
      - name: Communities drift guard
        run: bash scripts/check_communities_drift.sh
      - name: Verify generated CI path filters
        if: github.event_name == 'pull_request'
        run: python3 scripts/generate_ci_path_filters.py --check
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Filters generated from .github/ci-path-manifest.yml
          filters: .github/generated/ci-path-filters.yml
      - name: Select jobs
        id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "outside=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"

      - name: Guard unclassified PR paths
        id: outside
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          outside=false
          # shellcheck source=.github/generated/ci-path-outside.sh
          source .github/generated/ci-path-outside.sh
          while IFS= read -r path; do
            if ci_path_is_allowed "$path"; then
              continue
            fi
            echo "::error file=$path::Changed path is outside the CI gate and skip allowlist."
            outside=true
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          echo "outside=$outside" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff checks
        run: |
          uv run ruff check . & ruff_check_pid=$!
          uv run ruff format --check . & ruff_format_pid=$!
          wait "$ruff_check_pid"; ruff_check_exit=$?
          wait "$ruff_format_pid"; ruff_format_exit=$?
          exit $((ruff_check_exit || ruff_format_exit))
      - name: Mypy
        run: uv run mypy app
      - name: Prepare test environment
        run: uv run python tests/prepare_ci_env.py
      - name: Pytest (P0 — exclude integration tier)
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.test
        run: uv run pytest -m "not integration" -v --cov=app --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Production vite build rejects localhost/missing origin (OG tags in index.html).
      VITE_PUBLIC_ORIGIN: https://ci.example.test
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint and format check
        run: |
          npm run lint & lint_pid=$!
          npm run format:check & format_pid=$!
          wait "$lint_pid"; lint_exit=$?
          wait "$format_pid"; format_exit=$?
          exit $((lint_exit || format_exit))
      - run: npm run test:coverage
      - run: npm run build:check
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Built-shell smoke (vite preview, no API)
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/built-shell.spec.ts

  docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Determine Docker Hub publish eligibility
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::warning::Docker Hub publishing skipped; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish images."
            fi
          fi
      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: production
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'ci' }}/glorng-server:latest
            ${{ vars.DOCKERHUB_USERNAME || 'ci' }}/glorng-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=server-production
          cache-to: type=gha,scope=server-production,mode=max
      - name: Build production frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile.prod
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'ci' }}/glorng-client:latest
            ${{ vars.DOCKERHUB_USERNAME || 'ci' }}/glorng-client:sha-${{ github.sha }}
          build-args: |
            VITE_PUBLIC_ORIGIN=https://ci.example.test
          cache-from: type=gha,scope=client-production
          cache-to: type=gha,scope=client-production,mode=max

  ci-ok:
    if: always()
    needs: [changes, backend, frontend, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          DOCKER_SELECTED: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
          OUTSIDE: ${{ needs.changes.outputs.outside }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES"
            exit 1
          fi
          fail=0
          check() {
            local name="$1" selected="$2" result="$3"
            if [ "$selected" != "true" ]; then
              echo "$name: skipped"
              return
            fi
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          }
          check backend "$BACKEND" "$BACKEND_RESULT"
          check frontend "$FRONTEND" "$FRONTEND_RESULT"
          check docker-build "$DOCKER_SELECTED" "$DOCKER_RESULT"
          if [ "$OUTSIDE" != "false" ]; then
            echo "outside: changed paths are outside the PR gate and the skip allowlist ($OUTSIDE)"
            fail=1
          else
            echo "outside: false"
          fi
          exit "$fail"
