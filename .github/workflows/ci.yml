name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write
  pull-requests: read

# P0 PR gate — path-filtered jobs + ci-ok aggregator (see docs/reference/testing.md).
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      postgres: ${{ steps.select.outputs.postgres }}
      e2e: ${{ steps.select.outputs.e2e }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'client/**'
              - '.github/workflows/ci.yml'
            postgres:
              - 'server/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'client/**'
              - 'server/**'
              - 'docker-compose*.yml'
              - 'nginx/**'
              - 'server/tests/env/ci-docker.env'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'server/app/**'
              - 'scripts/generate_docs.py'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
      - name: Select jobs
        id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "postgres=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend="${{ steps.filter.outputs.backend }}"
          frontend="${{ steps.filter.outputs.frontend }}"
          postgres="${{ steps.filter.outputs.postgres }}"
          e2e="${{ steps.filter.outputs.e2e }}"
          docs="${{ steps.filter.outputs.docs }}"
          # E2E needs the frontend artifact — force frontend when e2e is selected.
          if [ "$e2e" = "true" ]; then
            frontend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff checks
        run: |
          uv run ruff check . & ruff_check_pid=$!
          uv run ruff format --check . & ruff_format_pid=$!
          wait "$ruff_check_pid"; ruff_check_exit=$?
          wait "$ruff_format_pid"; ruff_format_exit=$?
          exit $((ruff_check_exit || ruff_format_exit))
      # Existing typing debt — keep signal without blocking merge gates.
      - name: Mypy (advisory)
        continue-on-error: true
        run: uv run mypy app
      - name: Pytest (P0 — exclude integration tier)
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.test
        run: uv run pytest -m "not integration" -v --cov=app --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint and format check
        run: |
          npm run lint & lint_pid=$!
          npm run format:check & format_pid=$!
          wait "$lint_pid"; lint_exit=$?
          wait "$format_pid"; format_exit=$?
          exit $((lint_exit || format_exit))
      - run: npm run test:coverage
      - run: npm run build:check
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  # P1 postgres paths — audit/search dual-write (see docs/reference/testing.md).
  postgres-tests:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: glorng
          POSTGRES_PASSWORD: glorng_ci
          POSTGRES_DB: glorng
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glorng -d glorng"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Alembic migrations
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.postgres
        run: uv run alembic upgrade head
      - name: Postgres integration tests (P1)
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.postgres
        run: uv run pytest -m postgres -v

  e2e:
    needs: [changes, frontend]
    if: >-
      always()
      && needs.changes.outputs.e2e == 'true'
      && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: client/dist
      - name: Write CI env file
        run: |
          cp server/tests/env/ci-docker.env .env
          sed -i 's/^RUN_SEED=.*/RUN_SEED=true/' .env
      - name: Start API stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d redis mongodb
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build migrate server
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm migrate
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d server
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        working-directory: client
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        working-directory: client
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_API_URL: http://127.0.0.1:8000
          E2E_EMAIL: admin@admin.admin
          E2E_PASSWORD: MyTestPass123!
        run: |
          VITE_API_PROXY_TARGET=http://127.0.0.1:8000 npm run preview &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 2
          done
          npm run e2e
          kill $PREVIEW_PID

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Generate docs artifacts
        working-directory: server
        env:
          GLORNG_ENV_FILE: ${{ github.workspace }}/server/tests/.env.test
          UV_PROJECT_ENVIRONMENT: /tmp/glorng-server-venv
        run: |
          uv sync --frozen
          uv run python ../scripts/generate_docs.py

      - name: Check generated docs are committed
        run: |
          git add --intent-to-add docs/generated docs/public/openapi.json
          git diff --exit-code -- docs/generated docs/public/openapi.json \
            || (echo "::error::docs/generated is stale — run make docs-generate and commit" && exit 1)

      - name: Build VitePress
        working-directory: docs
        run: |
          npm ci
          npm run build

  ci-ok:
    if: always()
    needs: [changes, backend, frontend, postgres-tests, e2e, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          POSTGRES: ${{ needs.changes.outputs.postgres }}
          E2E: ${{ needs.changes.outputs.e2e }}
          DOCS: ${{ needs.changes.outputs.docs }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          POSTGRES_RESULT: ${{ needs.postgres-tests.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          fail=0
          check() {
            local name="$1" selected="$2" result="$3"
            if [ "$selected" != "true" ]; then
              echo "$name: skipped"
              return
            fi
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          }
          check backend "$BACKEND" "$BACKEND_RESULT"
          check frontend "$FRONTEND" "$FRONTEND_RESULT"
          check postgres-tests "$POSTGRES" "$POSTGRES_RESULT"
          check e2e "$E2E" "$E2E_RESULT"
          check docs "$DOCS" "$DOCS_RESULT"
          exit "$fail"
