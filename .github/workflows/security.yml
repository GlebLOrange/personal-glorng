name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pip: ${{ steps.select.outputs.pip }}
      npm: ${{ steps.select.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            pip:
              - 'server/uv.lock'
              - 'server/pyproject.toml'
              - '.github/workflows/security.yml'
            npm:
              - 'client/package-lock.json'
              - 'client/package.json'
              - '.github/workflows/security.yml'
      - name: Select audit jobs
        id: select
        run: |
          # Schedule and manual always run full audits.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pip=true" >> "$GITHUB_OUTPUT"
            echo "npm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pip=${{ steps.filter.outputs.pip }}" >> "$GITHUB_OUTPUT"
          echo "npm=${{ steps.filter.outputs.npm }}" >> "$GITHUB_OUTPUT"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  pip_audit:
    needs: changes
    if: needs.changes.outputs.pip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - name: Export locked requirements
        run: uv export --format requirements-txt --no-dev -o /tmp/requirements.txt
      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit -r /tmp/requirements.txt

  npm_audit:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only — not a merge gate (ruleset requires gitleaks + ci-ok).
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Lockfile-only: avoids peer-dep install failures when only auditing.
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=high
