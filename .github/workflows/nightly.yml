# P1 nightly tier — redis integration only (postgres runs on every PR in ci.yml).
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
      - run: uv sync --frozen
      - name: Redis integration tests (P1)
        env:
          APP_ENV: test
          ENABLE_POSTGRES: "false"
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
        run: uv run pytest -m redis -v
