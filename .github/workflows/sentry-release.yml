# P2 — optional Sentry client release / sourcemap upload
#
# DISABLED during development. Does not run on tags or manual dispatch until
# the job `if` is restored. Before production: set secrets SENTRY_AUTH_TOKEN,
# SENTRY_ORG, SENTRY_PROJECT; restore tag trigger; set job if to
# secrets.SENTRY_AUTH_TOKEN != ''.
#
# Does not deploy; uploads source maps for the built SPA so client stack
# traces resolve in Sentry.
name: sentry-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-sourcemaps:
    # Disabled in development — restore:
    #   if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    # and add push tags: ["v*"] under `on:` before production.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build client with Sentry upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # Align with SERVER_SENTRY_RELEASE / VITE_CLIENT_SENTRY_RELEASE at deploy
          VITE_CLIENT_SENTRY_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: npm run build
