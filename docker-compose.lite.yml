# Minimal default stack (used by `make` / `make dev`).
# Vite runs on the host: `make dev-lite-client`. No RabbitMQ / client container.
services:
  client:
    profiles:
      - docker-client

  server:
    ports:
      - "8000:8000"

  nginx:
    # nginx.dev-lite.conf + host.docker.internal are now the base defaults.
    depends_on:
      !override
      server:
        condition: service_healthy
